plugins {
    id 'com.android.application'
    // Firebase远程同步：如果需要，取消下面这行的注释
    // 同时需要在 app/ 目录下放 google-services.json
    // id 'com.google.gms.google-services'
}
android {
    namespace 'com.sister.habits'
    compileSdk 34
    defaultConfig {
        applicationId 'com.sister.habits'
        minSdk 24
        targetSdk 34
        versionCode 133
        versionName '3.0.82'

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    // ===== 2026-09-25：合并为单 APK =====
    // 原先分 phone / tv 两个 flavor，产出两个 APK。
    // 现合并：TV 能力直接进入 main 源集（见 app/src/main/），
    // 一个 APK 同时适配手机与电视，数据/PIN/词库全部共享。
    // 电视与手机的差异由运行时判断（UiModeManager）处理。
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            // CI 中通过 GitHub Secrets 注入环境变量（HABIT_*）；本地无环境变量时不启用
            def storePath = System.getenv('HABIT_STORE_FILE')
            if (storePath != null && !storePath.isEmpty()) {
                storeFile file(storePath)
                storePassword System.getenv('HABIT_STORE_PASSWORD')
                keyAlias System.getenv('HABIT_KEY_ALIAS')
                keyPassword System.getenv('HABIT_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            def storePath = System.getenv('HABIT_STORE_FILE')
            if (storePath != null && !storePath.isEmpty()) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        viewBinding true
    }
    testOptions {
        // 允许 JVM 单测中 android.jar 的 stub 方法返回默认值（如 Log.d）
        unitTests.returnDefaultValues = true
    }
    lint {
        // TV 渠道引入的新资源/清单不阻塞 release 打包（家族内自用，CI 稳定性优先）
        abortOnError false
        checkReleaseBuilds false
    }
    configurations.all {
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
    }
}
dependencies {
    // AndroidX Core
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.1'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.viewpager2:viewpager2:1.0.0'
    // Activity & Fragment
    implementation 'androidx.activity:activity:1.7.2'
    implementation 'androidx.fragment:fragment:1.6.1'
    // Room Database
    implementation 'androidx.room:room-runtime:2.5.2'
    annotationProcessor 'androidx.room:room-compiler:2.5.2'
    // Lifecycle
    implementation 'androidx.lifecycle:lifecycle-runtime:2.6.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.6.2'
    implementation 'androidx.lifecycle:lifecycle-common-java8:2.6.2'
    // NanoHTTPD (局域网HTTP Server)
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
    // ZXing (QR码生成/扫描)
    implementation 'com.google.zxing:core:3.5.1'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    // Gson (JSON序列化)
    implementation 'com.google.code.gson:gson:2.10.1'

    // AndroidX Biometric (指纹/设备解锁)
    implementation 'androidx.biometric:biometric:1.2.0-alpha05'
    // Glide (图片加载)
    implementation 'com.github.bumptech.glide:glide:4.15.1'
    // ===== TV 渠道专属：ExoPlayer 播放（看片功能）=====
    // 2026-09-25 单 APK 化：原为 tvImplementation（仅 tv flavor 可见），
    // 现已合并 flavor，改为 implementation 供全局使用。
    // 注：手机上也会打包 media3（+约 1MB），
    //   但 TvVideoActivity / TvPlayerActivity 在手机上不会被调起，无行为影响。
    implementation 'androidx.media3:media3-exoplayer:1.2.1'
    implementation 'androidx.media3:media3-ui:1.2.1'
    // ===== 单元测试 =====
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:4.11.0'
}