name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:  # 手动触发

# 权限设置
permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout 代码
        uses: actions/checkout@v5

      - name: ☕ 设置 JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🔧 设置 Android SDK
        uses: android-actions/setup-android@v4

      - name: 📦 缓存 Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 🔨 编译 Debug APK + 单元测试
        run: |
          chmod +x gradlew
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          # 从GitHub Secrets读取Token，不硬编码在代码中
          export GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}
          ./gradlew assembleDebug testDebugUnitTest --no-daemon

      - name: 📤 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: HabitTracker-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: 📤 上传 Release APK（未签名，仅用于测试）
        run: |
          echo "Release APK需要签名配置才能使用"
          echo "Debug APK已在上传产物中"
